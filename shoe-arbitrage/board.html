<title>신발 아비트리지 보드 · 포이즌 × 리테일</title>
<style>
  :root{
    --plane:#efeee9; --surface:#ffffff; --surface-2:#f7f6f2;
    --ink:#16150f; --ink-2:#57564e; --muted:#8b8a80;
    --hair:#e4e2da; --ring:rgba(20,21,15,.08);
    --accent:#1f6feb; --accent-soft:rgba(31,111,235,.10);
    --profit:#0a8f0a; --profit-soft:rgba(10,143,10,.10);
    --loss:#cf3b3b; --loss-soft:rgba(207,59,59,.10);
    --chip:#f0efe9; --chipink:#3b3a33;
    --shadow:0 1px 2px rgba(20,21,15,.05),0 8px 24px rgba(20,21,15,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --plane:#0c0c0b; --surface:#161615; --surface-2:#1e1e1c;
      --ink:#f4f3ec; --ink-2:#b8b7ac; --muted:#8a897f;
      --hair:#2a2a27; --ring:rgba(255,255,255,.09);
      --accent:#4b90ff; --accent-soft:rgba(75,144,255,.14);
      --profit:#39c23a; --profit-soft:rgba(57,194,58,.14);
      --loss:#f06a6a; --loss-soft:rgba(240,106,106,.13);
      --chip:#232320; --chipink:#cfcec3;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --plane:#efeee9; --surface:#ffffff; --surface-2:#f7f6f2;
    --ink:#16150f; --ink-2:#57564e; --muted:#8b8a80;
    --hair:#e4e2da; --ring:rgba(20,21,15,.08);
    --accent:#1f6feb; --accent-soft:rgba(31,111,235,.10);
    --profit:#0a8f0a; --profit-soft:rgba(10,143,10,.10);
    --loss:#cf3b3b; --loss-soft:rgba(207,59,59,.10);
    --chip:#f0efe9; --chipink:#3b3a33;
    --shadow:0 1px 2px rgba(20,21,15,.05),0 8px 24px rgba(20,21,15,.05);
  }
  :root[data-theme="dark"]{
    --plane:#0c0c0b; --surface:#161615; --surface-2:#1e1e1c;
    --ink:#f4f3ec; --ink-2:#b8b7ac; --muted:#8a897f;
    --hair:#2a2a27; --ring:rgba(255,255,255,.09);
    --accent:#4b90ff; --accent-soft:rgba(75,144,255,.14);
    --profit:#39c23a; --profit-soft:rgba(57,194,58,.14);
    --loss:#f06a6a; --loss-soft:rgba(240,106,106,.13);
    --chip:#232320; --chipink:#cfcec3;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--plane); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.45;
  }
  .num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
  .wrap{max-width:760px; margin:0 auto; padding:16px 14px 60px}

  header.top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px}
  .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700}
  h1{font-size:22px; line-height:1.15; margin:4px 0 4px; font-weight:800; letter-spacing:-.02em; text-wrap:balance}
  .sub{font-size:12.5px; color:var(--ink-2)}
  .head-r{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:8px}
  .themebtn{border:1px solid var(--hair); background:var(--surface); color:var(--ink-2);
    width:38px; height:38px; border-radius:11px; font-size:16px; cursor:pointer; display:grid; place-items:center}
  .themebtn:active{transform:scale(.95)}
  .snapsel{border:1px solid var(--hair); background:var(--surface); color:var(--ink); border-radius:11px;
    padding:8px 30px 8px 11px; font-size:12.5px; font-family:inherit; font-weight:700; cursor:pointer;
    -webkit-appearance:none; appearance:none; max-width:150px;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%; background-size:5px 5px,5px 5px; background-repeat:no-repeat}

  .datatools{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin:-4px 0 14px}
  .dbtn{border:1px solid var(--hair); background:var(--surface); color:var(--ink); border-radius:10px;
    padding:7px 12px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:5px}
  .dbtn.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  .dbtn:active{transform:scale(.97)}
  .dbtn[hidden]{display:none}
  .datamsg{font-size:11.5px; color:var(--muted); font-weight:600}
  .datamsg.ok{color:var(--profit)} .datamsg.err{color:var(--loss)}
  .localtag{font-size:10px; font-weight:800; letter-spacing:.03em; padding:2px 6px; border-radius:6px;
    background:var(--accent-soft); color:var(--accent); margin-left:6px; vertical-align:1px}
  .dropveil{position:fixed; inset:0; z-index:50; background:rgba(20,21,15,.72); display:none;
    align-items:center; justify-content:center; padding:24px}
  .dropveil.on{display:flex}
  .dropveil .inner{border:2px dashed rgba(255,255,255,.7); border-radius:20px; padding:44px 34px; text-align:center; color:#fff}
  .dropveil .big{font-size:34px; margin-bottom:10px}
  .dropveil .t{font-size:16px; font-weight:800} .dropveil .s{font-size:12.5px; opacity:.8; margin-top:5px}

  /* 요청함 */
  .reqbox{margin-bottom:16px; overflow:hidden}
  .reqhead{width:100%; border:0; background:none; color:var(--ink); font-family:inherit; cursor:pointer;
    display:flex; align-items:center; gap:8px; padding:13px 14px; font-size:14px; font-weight:800}
  .reqcount{font-size:12px; font-weight:800; min-width:22px; text-align:center; padding:2px 8px; border-radius:999px;
    background:var(--accent); color:#fff}
  .reqcount.zero{background:var(--hair); color:var(--muted)}
  .reqhead .chev{margin-left:auto; color:var(--muted); transition:transform .15s}
  .reqbox.open .reqhead .chev{transform:rotate(180deg)}
  .reqbody{padding:0 14px 14px; display:flex; flex-direction:column; gap:11px; border-top:1px solid var(--hair)}
  .reqbody[hidden]{display:none}
  .reqlabel{font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.02em; margin-top:11px}
  #genreq{width:100%; border:1px solid var(--hair); background:var(--surface-2); color:var(--ink); border-radius:10px;
    padding:10px 12px; font-size:13px; font-family:inherit; resize:vertical; min-height:58px; line-height:1.5}
  #genreq:focus{outline:2px solid var(--accent); outline-offset:1px}
  .reqitems{display:flex; flex-direction:column; gap:8px}
  .reqempty{font-size:12px; color:var(--muted); padding:4px 0}
  .reqitem{border:1px solid var(--hair); border-radius:11px; padding:9px 10px; background:var(--surface-2)}
  .reqitem-top{display:flex; align-items:center; gap:7px; margin-bottom:6px}
  .reqitem-name{font-size:12px; font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
  .reqitem-m{font-size:11.5px; font-weight:800; color:var(--profit); flex:none}
  .reqitem-x{border:0; background:none; color:var(--muted); cursor:pointer; font-size:15px; padding:0 2px; flex:none}
  .reqmemo{width:100%; border:1px solid var(--hair); background:var(--surface); color:var(--ink); border-radius:8px;
    padding:7px 9px; font-size:12px; font-family:inherit}
  .reqmemo:focus{outline:2px solid var(--accent); outline-offset:1px}
  .reqmemo::placeholder{color:var(--muted)}
  .reqactions{display:flex; gap:8px; margin-top:2px}

  .pin{margin-left:auto; border:1px solid var(--hair); background:var(--surface); color:var(--muted); cursor:pointer;
    border-radius:8px; padding:3px 9px; font-size:11px; font-weight:700; font-family:inherit; display:inline-flex; align-items:center; gap:4px}
  .pin.on{background:var(--accent); color:#fff; border-color:var(--accent)}
  .rank+.pin{margin-left:8px}
  .row-memo{margin-top:9px}
  .row-memo input{width:100%; border:1px dashed var(--accent); background:var(--accent-soft); color:var(--ink);
    border-radius:8px; padding:7px 9px; font-size:12px; font-family:inherit}
  .row-memo input:focus{outline:2px solid var(--accent); outline-offset:1px}
  .row-memo[hidden]{display:none}

  .kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-bottom:16px}
  @media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .kpi{background:var(--surface); border:1px solid var(--hair); border-radius:14px; padding:12px 13px; box-shadow:var(--shadow)}
  .kpi .lab{font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.02em}
  .kpi .val{font-size:22px; font-weight:800; margin-top:3px}
  .kpi .val.small{font-size:19px}
  .kpi .val.pos{color:var(--profit)}
  .kpi .delta{font-size:11px; font-weight:700; margin-top:2px}
  .kpi .delta.up{color:var(--profit)} .kpi .delta.down{color:var(--loss)} .kpi .delta.flat{color:var(--muted)}

  .card{background:var(--surface); border:1px solid var(--hair); border-radius:16px; box-shadow:var(--shadow)}
  .sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:22px 2px 10px}
  .sec-h h2{font-size:15px; font-weight:800; margin:0; letter-spacing:-.01em}
  .sec-h .hint{font-size:11.5px; color:var(--muted)}

  .mapwrap{padding:12px 12px 10px}
  .mapcanvas-box{position:relative; width:100%; height:260px}
  canvas{display:block; width:100%; height:100%; touch-action:pan-y}
  .axhint{display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted); margin-top:6px; padding:0 2px}
  .readout{min-height:40px; margin-top:8px; padding:9px 11px; border-radius:11px; background:var(--surface-2);
    border:1px solid var(--hair); font-size:12px; color:var(--ink-2); display:flex; align-items:center; gap:9px}
  .readout.empty{color:var(--muted)}
  .readout b{color:var(--ink)}

  .controls{display:flex; flex-direction:column; gap:11px}
  .stickytop{position:sticky; top:0; z-index:6; background:var(--plane); margin:0 -14px; padding:8px 14px 10px;
    display:flex; flex-direction:column; gap:10px}
  .searchrow{display:flex; gap:8px}
  .search{flex:1; display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--hair);
    border-radius:12px; padding:9px 12px}
  .search input{border:0; background:none; outline:none; color:var(--ink); font-size:14px; width:100%; font-family:inherit}
  .search input::placeholder{color:var(--muted)}
  .search .ic{color:var(--muted); font-size:14px}
  select.sortsel{border:1px solid var(--hair); background:var(--surface); color:var(--ink); border-radius:12px;
    padding:9px 10px; font-size:13px; font-family:inherit; font-weight:600; -webkit-appearance:none; appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:30px}
  .chiprow{display:flex; gap:7px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; scrollbar-width:none}
  .chiprow::-webkit-scrollbar{display:none}
  .chip{flex:none; border:1px solid var(--hair); background:var(--chip); color:var(--chipink); border-radius:999px;
    padding:6px 13px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; transition:.12s}
  .chip.on{background:var(--ink); color:var(--surface); border-color:var(--ink)}
  .chip .n{opacity:.55; font-weight:600; margin-left:5px; font-size:11px}
  .toggle{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-2); font-weight:600; cursor:pointer; user-select:none}
  .toggle .sw{width:36px; height:21px; border-radius:999px; background:var(--hair); position:relative; transition:.15s; flex:none}
  .toggle .sw::after{content:""; position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%; background:#fff; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .toggle.on .sw{background:var(--profit)}
  .toggle.on .sw::after{left:17px}
  .toolrow{display:flex; gap:14px; flex-wrap:wrap; align-items:center}
  .feerow{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--ink-2)}
  .feecfg{border:1px solid var(--hair); background:var(--surface); color:var(--muted); font-family:inherit;
    font-size:11.5px; font-weight:700; border-radius:8px; padding:5px 10px; cursor:pointer}
  .feecfg.on{color:var(--accent); border-color:var(--accent)}
  .feefields{display:flex; align-items:center; gap:10px; flex-wrap:wrap; width:100%; padding-top:2px}
  .feefields[hidden]{display:none}
  .feefields label{display:inline-flex; align-items:center; gap:4px; font-weight:600}
  .feefields input{width:62px; border:1px solid var(--hair); background:var(--surface); color:var(--ink);
    border-radius:8px; padding:5px 7px; font-size:12.5px; font-family:inherit; text-align:right; font-variant-numeric:tabular-nums}
  .feefields input:focus{outline:2px solid var(--accent); outline-offset:1px}

  .countline{font-size:12px; color:var(--muted); margin:2px 2px 10px; display:flex; justify-content:space-between}

  .row-code{display:flex; align-items:center; gap:8px; margin-bottom:9px}
  .codeval{font-size:14px; font-weight:800; color:var(--accent); letter-spacing:.01em; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; background:none; border:0; padding:0; font-family:inherit; cursor:pointer;
    text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px; text-decoration-color:var(--hair)}
  .codeval.none{color:var(--muted); font-weight:600; cursor:default; text-decoration:none}
  .actbtns{margin-left:auto; flex:none; display:flex; gap:5px}
  .act{border:1px solid var(--hair); background:var(--surface-2); color:var(--ink-2); border-radius:8px;
    width:32px; height:28px; display:grid; place-items:center; font-size:13.5px; cursor:pointer; font-family:inherit; padding:0}
  .act:active{transform:scale(.92)}
  .act.on{background:var(--accent); color:#fff; border-color:var(--accent)}
  .act.done{background:var(--profit); color:#fff; border-color:var(--profit)}
  .netnote{font-size:10.5px; color:var(--muted); font-weight:600; margin-top:2px}
  .netnote s{opacity:.8}

  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(10px); z-index:60;
    background:var(--ink); color:var(--plane); font-size:13px; font-weight:700; padding:11px 18px; border-radius:999px;
    box-shadow:0 8px 30px rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .18s,transform .18s; max-width:82vw; text-align:center}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

  /* 품번 비교 모달 */
  .cmpmodal{position:fixed; inset:0; z-index:70; background:rgba(20,21,15,.55); display:flex; align-items:flex-end; justify-content:center}
  .cmpmodal[hidden]{display:none}
  .cmpcard{background:var(--surface); width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:16px 16px 24px;
    max-height:82vh; overflow-y:auto; box-shadow:0 -8px 40px rgba(0,0,0,.35)}
  @media(min-width:560px){ .cmpmodal{align-items:center} .cmpcard{border-radius:18px} }
  .cmphead{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:6px}
  .cmpcode{font-size:15px; font-weight:800; color:var(--accent)}
  .cmpname{font-size:12.5px; color:var(--ink-2); margin-top:2px; line-height:1.4}
  .cmpx{border:0; background:none; font-size:24px; color:var(--muted); cursor:pointer; line-height:.8; flex:none}
  .cmpmkt{font-size:11.5px; color:var(--muted); font-weight:600; margin-bottom:12px}
  .cmplist{display:flex; flex-direction:column; gap:8px}
  .cmprow{display:flex; align-items:center; gap:10px; padding:11px 13px; border:1px solid var(--hair); border-radius:12px; background:var(--surface-2)}
  .cmprow.best{border-color:var(--profit); background:var(--profit-soft)}
  .cmp-site{font-size:13px; font-weight:700; flex:1; display:flex; align-items:center}
  .cmp-best{font-size:10px; font-weight:800; color:var(--profit); border:1px solid var(--profit); border-radius:6px; padding:1px 6px; margin-left:7px}
  .cmp-r{text-align:right}
  .cmp-src{font-size:14px; font-weight:800; font-variant-numeric:tabular-nums}
  .cmp-net{font-size:11.5px; font-weight:700; color:var(--profit); font-variant-numeric:tabular-nums} .cmp-net.neg{color:var(--loss)}
  .cmpsingle{font-size:12.5px; color:var(--muted); padding:8px 2px}

  .list{display:flex; flex-direction:column; gap:10px}
  .row{background:var(--surface); border:1px solid var(--hair); border-radius:15px; padding:13px 14px; box-shadow:var(--shadow);
    position:relative; overflow:hidden}
  .row::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--profit)}
  .row.neg::before{background:var(--loss)}
  .row-top{display:flex; align-items:center; gap:7px; margin-bottom:7px; flex-wrap:wrap}
  .brand{font-size:11px; font-weight:800; letter-spacing:.02em; padding:3px 8px; border-radius:7px; background:var(--accent-soft); color:var(--accent)}
  .site{font-size:11px; color:var(--muted); font-weight:600}
  .rank{margin-left:auto; font-size:11px; color:var(--muted); font-weight:700}
  .pname{font-size:13.5px; font-weight:600; line-height:1.35; margin:0 0 10px; color:var(--ink)}
  .flow{display:flex; align-items:flex-end; justify-content:space-between; gap:10px}
  .prices{display:flex; align-items:center; gap:9px; font-size:12px; color:var(--ink-2); flex-wrap:wrap}
  .price b{display:block; font-size:9.5px; color:var(--muted); font-weight:700; letter-spacing:.04em; text-transform:uppercase; margin-bottom:1px}
  .price .v{font-size:14px; font-weight:700; color:var(--ink)}
  .arrow{color:var(--muted); font-size:15px; padding-bottom:1px}
  .marg{text-align:right; flex:none}
  .marg .m{font-size:19px; font-weight:800; color:var(--profit)}
  .marg .p{font-size:11.5px; font-weight:700; color:var(--profit)}
  .row.neg .marg .m,.row.neg .marg .p{color:var(--loss)}
  .demand{display:flex; align-items:center; gap:7px; margin-top:11px}
  .demand .dl{font-size:10.5px; color:var(--muted); font-weight:700; flex:none}
  .dbar{flex:1; height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden}
  .dbar i{display:block; height:100%; border-radius:999px; background:var(--accent)}
  .dval{font-size:11.5px; font-weight:700; color:var(--ink-2); flex:none}
  .dval.zero{color:var(--muted)}

  .more{margin:16px auto 0; display:block; border:1px solid var(--hair); background:var(--surface); color:var(--ink);
    border-radius:12px; padding:12px 22px; font-size:14px; font-weight:700; cursor:pointer; box-shadow:var(--shadow)}
  .more:active{transform:scale(.98)}
  .empty-list{text-align:center; color:var(--muted); padding:40px 0; font-size:13px}
  .foot{margin-top:26px; font-size:11px; color:var(--muted); text-align:center; line-height:1.6}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:8px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}

  /* 탭 (기회 / 재고) */
  .tabs{display:flex; gap:6px; background:var(--surface-2); border:1px solid var(--hair); border-radius:13px; padding:4px; margin-bottom:16px}
  .tab{flex:1; border:0; background:none; color:var(--ink-2); font-family:inherit; font-size:13.5px; font-weight:800;
    padding:9px 8px; border-radius:10px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px}
  .tab.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
  .tabbadge{font-size:11px; font-weight:800; padding:1px 7px; border-radius:999px; background:var(--accent); color:#fff}
  .tabbadge.zero{display:none}
  body[data-view="inv"] .opps-only{display:none}
  body[data-view="opps"] .inv-only{display:none}

  /* 재고 */
  .invhead{display:flex; align-items:baseline; justify-content:space-between; margin:2px 2px 12px}
  .invhead h2{font-size:16px; font-weight:800; margin:0}
  .invhead .sub2{font-size:11.5px; color:var(--muted)}
  .invsum{display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-bottom:14px}
  @media(min-width:560px){.invsum{grid-template-columns:repeat(4,1fr)}}
  .invtile{background:var(--surface); border:1px solid var(--hair); border-radius:14px; padding:11px 13px; box-shadow:var(--shadow)}
  .invtile .l{font-size:11px; color:var(--muted); font-weight:600}
  .invtile .v{font-size:18px; font-weight:800; margin-top:3px}

<script>
/* 외부 라이브러리 없이 브라우저 내장 DecompressionStream으로 xlsx(zip)를 파싱 → build.py와 동일한 스냅샷 포맷 생성 */
window.ShoeXlsx = (function(){
  const u16=(dv,o)=>dv.getUint16(o,true), u32=(dv,o)=>dv.getUint32(o,true);
  async function inflateRaw(bytes){
    const ds=new DecompressionStream('deflate-raw');
    const buf=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
    return new Uint8Array(buf);
  }
  async function unzip(ab){
    const bytes=new Uint8Array(ab), dv=new DataView(ab);
    let eocd=-1;
    for(let i=bytes.length-22;i>=0;i--){ if(u32(dv,i)===0x06054b50){eocd=i;break;} }
    if(eocd<0) throw new Error('올바른 xlsx(zip) 파일이 아닙니다.');
    const cdOff=u32(dv,eocd+16), cnt=u16(dv,eocd+10), files={};
    let p=cdOff;
    for(let n=0;n<cnt;n++){
      if(u32(dv,p)!==0x02014b50) break;
      const method=u16(dv,p+10), compSize=u32(dv,p+20);
      const nameLen=u16(dv,p+28), extraLen=u16(dv,p+30), cmtLen=u16(dv,p+32), lho=u32(dv,p+42);
      const name=new TextDecoder().decode(bytes.subarray(p+46,p+46+nameLen));
      files[name]={method,compSize,lho}; p+=46+nameLen+extraLen+cmtLen;
    }
    const dec=new TextDecoder();
    async function readText(name){
      const f=files[name]; if(!f) return null;
      const lNameLen=u16(dv,f.lho+26), lExtraLen=u16(dv,f.lho+28);
      const start=f.lho+30+lNameLen+lExtraLen, comp=bytes.subarray(start,start+f.compSize);
      const raw=f.method===0?comp:await inflateRaw(comp);
      return dec.decode(raw);
    }
    return {files,readText};
  }
  const colNum=r=>{let m=/^([A-Z]+)/.exec(r); if(!m)return 0; let n=0; for(const c of m[1]) n=n*26+(c.charCodeAt(0)-64); return n-1;};
  function parseXML(s){return new DOMParser().parseFromString(s,'application/xml');}
  function sharedStrings(xml){
    if(!xml) return [];
    const doc=parseXML(xml), out=[];
    for(const si of doc.getElementsByTagName('si')){
      let t=''; for(const tn of si.getElementsByTagName('t')) t+=tn.textContent;
      out.push(t);
    }
    return out;
  }
  function sheetRows(xml, shared){
    const doc=parseXML(xml), rows=[];
    for(const row of doc.getElementsByTagName('row')){
      const arr=[];
      for(const c of row.getElementsByTagName('c')){
        const ci=colNum(c.getAttribute('r')||'A'), t=c.getAttribute('t');
        let v=null;
        if(t==='inlineStr'){const is=c.getElementsByTagName('t')[0]; v=is?is.textContent:'';}
        else{const vn=c.getElementsByTagName('v')[0]; if(vn){ v = t==='s' ? (shared[+vn.textContent]||'') : vn.textContent; }}
        arr[ci]=v;
      }
      rows.push(arr);
    }
    return rows;
  }
  async function sheetMap(zip){
    const wb=parseXML(await zip.readText('xl/workbook.xml'));
    const rels=parseXML(await zip.readText('xl/_rels/workbook.xml.rels'));
    const rid={}; for(const r of rels.getElementsByTagName('Relationship')) rid[r.getAttribute('Id')]=r.getAttribute('Target');
    const map={};
    for(const sh of wb.getElementsByTagName('sheet')){
      const name=sh.getAttribute('name');
      const id=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
      let tgt=rid[id]||'';
      if(tgt.startsWith('/')) tgt=tgt.slice(1);
      else if(tgt && !tgt.startsWith('xl/')) tgt='xl/'+tgt;
      map[name]=tgt;
    }
    return map;
  }
  function num(v){const n=parseFloat(v); return isFinite(n)?n:0;}
  function normalize(rows, date){
    const brands=[], sites=[];
    const idx=(lst,v)=>{v=(v==null||v==='')?'기타':(''+v); let i=lst.indexOf(v); if(i<0){lst.push(v); i=lst.length-1;} return i;};
    const recs=[];
    for(let i=1;i<rows.length;i++){
      const r=rows[i]; if(!r||r[0]==null) continue;
      recs.push([ (''+(r[2]||'')).trim(), idx(brands,r[3]), idx(sites,r[4]),
        Math.round(num(r[5])), Math.round(num(r[6])), Math.round(num(r[8])),
        Math.round(num(r[9])), Math.round(num(r[10])), Math.round(num(r[11])*10)/10,
        (''+(r[1]||'')).trim() ]);   // 9: 상품 코드
    }
    const pos=recs.filter(x=>x[7]>0);
    const m={ total:recs.length, arb:pos.length,
      avgMargin: pos.length?Math.round(pos.reduce((a,x)=>a+x[7],0)/pos.length):0,
      avgMpct: pos.length?Math.round(pos.reduce((a,x)=>a+x[8],0)/pos.length*10)/10:0,
      bestMargin: recs.reduce((a,x)=>Math.max(a,x[7]),0), date };
    return {b:brands, s:sites, r:recs, m};
  }
  function detectDate(rows, fname){
    const rx=/(20\d{2})[-.](\d{1,2})[-.](\d{1,2})/;
    for(const row of rows) for(const c of row){ if(typeof c==='string'){const m=rx.exec(c); if(m) return `${m[1]}-${(''+m[2]).padStart(2,'0')}-${(''+m[3]).padStart(2,'0')}`; } }
    const f=/(20\d{2})-?(\d{2})-?(\d{2})/.exec(fname||''); if(f) return `${f[1]}-${f[2]}-${f[3]}`;
    return new Date().toISOString().slice(0,10);
  }
  async function parse(file){
    if(typeof DecompressionStream==='undefined') throw new Error('이 브라우저는 자동 파싱을 지원하지 않아요. PC의 build.py를 쓰세요.');
    const zip=await unzip(await file.arrayBuffer());
    const shared=sharedStrings(await zip.readText('xl/sharedStrings.xml'));
    const map=await sheetMap(zip);
    const findSheet=pre=>Object.keys(map).find(n=>n.startsWith(pre));
    const matchName=findSheet('전체매칭')||findSheet('수요');
    if(!matchName) throw new Error("'전체매칭' 시트를 찾지 못했습니다.");
    const rows=sheetRows(await zip.readText(map[matchName]), shared);
    let dateRows=rows;
    const sumName=findSheet('요약');
    if(sumName){ try{ dateRows=sheetRows(await zip.readText(map[sumName]), shared).concat(rows);}catch(e){} }
    const date=detectDate(dateRows, file.name);
    return {date, snap:normalize(rows, date)};
  }
  return {parse};
})();

  function demandFmt(v){
    if(v>=100000000) return (v/100000000).toFixed(v>=1000000000?0:1).replace(/\.0$/,'')+'억';
    if(v>=10000) return Math.round(v/10000).toLocaleString('ko-KR')+'만';
    return v.toLocaleString('ko-KR');

  // 실수령 마진: 포이즌 수수료(신발 10%, 하한 15000, 상한 45000)를 판매가에서 뺀 값
  const FEE_KEY='shoeArb.fees.v2';

  function feesActive(){ return feeOn; }
  function poizonFee(p){ return Math.min(feeCap, Math.max(feeFloor, Math.round(p*feeRate/100))); }
  function netMargin(x){ return Math.round(x[5] - poizonFee(x[5]) - feeExtra - x[3]); }

  }

  // ---------- filtering / list ----------
  function dedupeByCode(list){
    const best={}, noCode=[];
    for(const x of list){
      const code=x[9];

      if(!best[code] || effMargin(x)>effMargin(best[code])) best[code]=x;

    return Object.values(best).concat(noCode);
  }
  function currentFilter(){
    const ql=query.toLowerCase();

      margin:(a,b)=>effMargin(b)-effMargin(a),
      mpct:(a,b)=>effMpct(b)-effMpct(a),
      vol:(a,b)=>b[6]-a[6],
    }[sortKey];
    f.sort(cmp);
    return f;

  function rowHTML(x,rank){

    const key=reqKey(x), on=!!reqItems[key];

  // ---------- opportunity map ----------
  const cv=$('map'), ctx=cv.getContext('2d'), readout=$('readout');
  let pts=[], W=0,H=0,dpr=1;
  const PAD={l:38,r:12,t:14,b:8};
  const cssvar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function resize(){
    const box=cv.parentElement.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2); W=box.width; H=box.height;
    cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); drawMap();
  }
  function drawMap(){
    if(!W||!R) return;
    const plotData=(filtered.length?filtered:R).filter(x=>effMargin(x)>0);
    ctx.clearRect(0,0,W,H);
    const muted=cssvar('--muted'), hair=cssvar('--hair'), profit=cssvar('--profit'), accent=cssvar('--accent');
    const maxM=Math.max(50000, ...plotData.map(x=>effMargin(x)));
    const plotW=W-PAD.l-PAD.r, plotH=H-PAD.t-PAD.b;
    const X=v=>PAD.l+plotW*(Math.log10(v+1)/logMax);
    const Y=v=>PAD.t+plotH*(1-Math.min(v,maxM)/maxM);
    // 가로 격자 + 마진 눈금
    ctx.strokeStyle=hair; ctx.lineWidth=1; ctx.fillStyle=muted;
    ctx.font='10px ui-monospace,Menlo,monospace'; ctx.textAlign='right'; ctx.textBaseline='middle';
    for(let i=0;i<=3;i++){const val=maxM*i/3, yy=Y(val);
      ctx.beginPath(); ctx.moveTo(PAD.l,yy); ctx.lineTo(W-PAD.r,yy); ctx.stroke();
      ctx.fillText(val>=10000?Math.round(val/10000)+'만':'0', PAD.l-6, yy);}
    // 추천 상위(마진×수요) 집합 — 이게 실제 "꿀"
    const topN = plotData.slice().sort((a,b)=>score(b)-score(a)).slice(0,6);
    const topSet = new Set(topN);
    pts=[];
    // 일반 점 먼저
    for(const x of plotData){
      if(topSet.has(x)) continue;
      const px=X(x[6]), py=Y(effMargin(x));
      ctx.beginPath(); ctx.arc(px,py,x[6]===0?2.2:3,0,7);
      ctx.fillStyle=accent; ctx.globalAlpha=x[6]===0?0.28:0.6; ctx.fill();
      pts.push([px,py,x]);
    }
    // 추천 상위 강조 (초록 + 흰 링)
    ctx.globalAlpha=1;
    for(const x of topN){
      const px=X(x[6]), py=Y(effMargin(x));
      ctx.beginPath(); ctx.arc(px,py,5,0,7); ctx.fillStyle=profit; ctx.fill();
      ctx.lineWidth=1.5; ctx.strokeStyle=cssvar('--surface'); ctx.stroke();
      pts.push([px,py,x]);
    }
    // 1위 직접 라벨
    if(topN.length){
      const x=topN[0], px=X(x[6]), py=Y(effMargin(x));
      const nm=(x[0]||'').slice(0,10)+((x[0]||'').length>10?'…':'');
      ctx.fillStyle=profit; ctx.font='700 10px system-ui'; ctx.textBaseline='bottom';
      const rightHalf = px > W*0.6;
      ctx.textAlign = rightHalf?'right':'left';
      ctx.fillText('★ '+nm, px + (rightHalf?-8:8), py-6);
    }
  }

        <div class="invf"><label>구매가</label><input data-f="buyPrice" type="number" inputmode="numeric" value="${it.buyPrice||0}"></div>
        <div class="invf"><label>수량</label><input data-f="qty" type="number" min="1" inputmode="numeric" value="${it.qty||1}"></div>
        <div class="invf"><label>택배비</label><input data-f="ship" type="number" inputmode="numeric" value="${it.ship||0}"></div>
        <div class="invf"><label>구매일</label><input data-f="buyDate" type="date" value="${it.buyDate||''}"></div>
        <div class="invf sellonly" ${sold?'':'hidden'}><label>판매가</label><input data-f="sellPrice" type="number" inputmode="numeric" value="${it.sellPrice||''}"></div>
        <div class="invf sellonly" ${sold?'':'hidden'}><label>판매일</label><input data-f="sellDate" type="date" value="${it.sellDate||''}"></div>
      </div>
      <div class="invpl">
        <span class="pll">${sold?'확정 손익':'예상 실현이익 · 시장가 '+won(it.marketPrice||0)}</span>
        <span class="plv ${pl<0?'neg':''}">${signed(pl)}</span>
      </div>
    </div>`;
  }
  function renderInvList(){
    const box=$('invlist');
    if(!inv.length){ box.innerHTML='<div class="invempty">아직 재고가 없어요.<br>「🔎 기회 찾기」에서 상품 카드의 <b>🛒 구매</b>를 누르면 여기에 담깁니다.</div>'; return; }
    const order=inv.slice().sort((a,b)=>(a.status==='sold')-(b.status==='sold'));
    box.innerHTML=order.map(invRowHTML).join('');
  }
  function renderInv(){ renderInvSummary(); renderInvList(); updateInvBadge(); }
  function findInv(id){ return inv.find(i=>i.id===id); }

  $('invlist').addEventListener('input',e=>{
    const inp=e.target.closest('[data-f]'); if(!inp) return;
    const it=findInv(inp.closest('.invrow').getAttribute('data-id')); if(!it) return;
    const f=inp.dataset.f;
    it[f] = (f==='buyDate'||f==='sellDate') ? inp.value : (+inp.value||0);
    persistInvSoon();
    const row=inp.closest('.invrow'); const pl=invPL(it);
    const plv=row.querySelector('.plv'); plv.textContent=signed(pl); plv.classList.toggle('neg',pl<0);
    renderInvSummary();
  });
  $('invlist').addEventListener('click',e=>{
    const st=e.target.closest('[data-act="status"]');
    if(st){ const it=findInv(st.closest('.invrow').getAttribute('data-id')); if(!it) return;
      if(it.status==='sold'){ it.status='holding'; }
      else { it.status='sold'; if(!it.sellPrice) it.sellPrice=it.marketPrice||0; if(!it.sellDate) it.sellDate=today(); }
      persistInv(); renderInv(); return; }
    const del=e.target.closest('[data-act="invdel"]');
    if(del){ const id=del.closest('.invrow').getAttribute('data-id');
      if(!confirm('이 재고 항목을 삭제할까요?')) return;
      inv=inv.filter(i=>i.id!==id); persistInv(); renderInv(); }
  });

  function downloadFile(text, name, mime){
    const blob=new Blob([text],{type:mime}); const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href);
  }
  function csvCell(v){ v=(v==null?'':''+v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
  $('invExportCsv').addEventListener('click',()=>{
    if(!inv.length){ toast('재고가 비어 있어요'); return; }
    const head=['품번','상품명','브랜드','매장','구매가','수량','택배비','구매일','상태','판매가','판매일','기준시장가','단위손익','총손익'];
    const rows=inv.map(it=>{ const sold=it.status==='sold'; const unit=invUnitNet(it, sold?it.sellPrice:it.marketPrice);
      return [it.code,it.name,it.brand,it.site,it.buyPrice,it.qty,it.ship,it.buyDate, sold?'판매완료':'보유중',
        sold?it.sellPrice:'', it.sellDate||'', it.marketPrice, unit, unit*(+it.qty||1)]; });
    const csv=[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
    downloadFile('﻿'+csv, `inventory-${today()}.csv`, 'text/csv;charset=utf-8');
    toast('CSV 내려받음 · 엑셀에서 열림');
  });
  $('invExportJson').addEventListener('click',()=>{
    if(!inv.length){ toast('재고가 비어 있어요'); return; }
    downloadFile(JSON.stringify({tool:'shoe-arbitrage',kind:'inventory',exportedAt:new Date().toISOString(),items:inv},null,2),
      `inventory-${today()}.json`,'application/json');
    toast('JSON 내려받음');
  });
  $('invClearSold').addEventListener('click',()=>{
    const soldN=inv.filter(i=>i.status==='sold').length;
    if(!soldN){ toast('판매완료 항목이 없어요'); return; }
    if(!confirm(`판매완료 ${soldN}건을 목록에서 지울까요? (CSV로 먼저 백업 권장)`)) return;
    inv=inv.filter(i=>i.status!=='sold'); persistInv(); renderInv();
  });

  // 탭 전환
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on'); document.body.dataset.view=t.dataset.view;
    if(t.dataset.view==='inv') renderInv();
  }));

  // init
  document.body.dataset.view='opps';
  updateInvBadge();
  refreshSnapSelect();
  renderReq();
  loadSnapshot(curDate);
  window.addEventListener('resize',resize);
  resize();
})();
</script>
